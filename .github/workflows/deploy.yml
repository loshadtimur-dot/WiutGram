name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: production
    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; missing=1; fi
          done
          exit "$missing"

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script (backup, pull, migrate, restart, health check)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'sudo -n /opt/uni-lovers/deploy/deploy.sh'

      - name: Verify public health endpoint
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          target="${SITE_URL:-https://$VPS_HOST}/api/health"
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 "$target" || true)
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Health check passed: $body"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Health check failed at $target"
          exit 1

      - name: Rollback on failed verification
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'sudo -n /opt/uni-lovers/deploy/rollback.sh || true'

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
