# /etc/nginx/sites-available/uni-lovers
# Run: certbot --nginx -d uni-lovers.uz -d www.uni-lovers.uz

upstream uni_lovers {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name uni-lovers.uz www.uni-lovers.uz;
    return 301 https://uni-lovers.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uni-lovers.uz www.uni-lovers.uz;

    ssl_certificate     /etc/letsencrypt/live/uni-lovers.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uni-lovers.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /uploads/ {
        proxy_pass http://uni_lovers;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /socket.io/ {
        proxy_pass http://uni_lovers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://uni_lovers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
